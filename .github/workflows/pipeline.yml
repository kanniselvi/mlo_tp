name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py

      - name: Verify Train Test Splits
        run: |
          ls -l tourism_project/data/
          test -f tourism_project/data/Xtrain.csv
          test -f tourism_project/data/Xtest.csv
          test -f tourism_project/data/ytrain.csv
          test -f tourism_project/data/ytest.csv

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/Xtrain.csv
            tourism_project/data/Xtest.csv
            tourism_project/data/ytrain.csv
            tourism_project/data/ytest.csv
          if-no-files-found: error

  model-training:
    name: Model Training
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/

      - name: Verify Downloaded Files
        run: |
          ls -l tourism_project/data/

      - name: Model Building
        run: |
          python tourism_project/model_building/train.py

      - name: Verify Trained Model
        run: |
          test -f tourism_project/deployment/best_model.pkl

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.pkl

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained tourism model [skip ci]"
            git push origin HEAD:main
          fi
